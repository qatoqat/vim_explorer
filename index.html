<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vim Movement Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; padding: 20px; }

        .movement-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .movement-box {
            border: 1px solid #ccc;
            padding: 15px;
            position: relative;
        }

        .movement-title {
            position: absolute;
            top: -12px;
            left: 10px;
            background: white;
            padding: 0 5px;
        }

        .movement-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .key {
            border: 1px solid #eee;
            padding: 8px;
            text-align: center;
        }

        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .up { grid-column: 2; grid-row: 1; }
        .down { grid-column: 2; grid-row: 3; }
        .center { grid-column: 2; grid-row: 2; }
    </style>
</head>
<body>
    <div class="movement-container">
        <div class="movement-box">
            <div class="movement-title">Character</div>
            <div class="movement-grid">
                <div class="key up">k (up)</div>
                <div class="key left">h (left)</div>
                <div class="key right">l (right)</div>
                <div class="key down">j (down)</div>
                <div class="key center">.</div>
            </div>
        </div>

        <div class="movement-box">
            <div class="movement-title">Word</div>
            <div class="movement-grid">
                <div class="key left">b (prev)</div>
                <div class="key right">w (next)</div>
                <div class="key up">B (WORD)</div>
                <div class="key down">W (WORD)</div>
                <div class="key center">e (end)</div>
            </div>
        </div>

        <div class="movement-box">
            <div class="movement-title">Line</div>
            <div class="movement-grid">
                <div class="key left">0 (start)</div>
                <div class="key right">$ (end)</div>
                <div class="key center">^ (first)</div>
            </div>
        </div>

        <div class="movement-box">
            <div class="movement-title">Paragraph</div>
            <div class="movement-grid">
                <div class="key up">{ (prev)</div>
                <div class="key down">} (next)</div>
                <div class="key center">) (sentence)</div>
            </div>
        </div>

        <div class="movement-box">
            <div class="movement-title">Screen</div>
            <div class="movement-grid">
                <div class="key up">H (high)</div>
                <div class="key down">L (low)</div>
                <div class="key center">M (middle)</div>
                <div class="key left">^U (up)</div>
                <div class="key right">^D (down)</div>
            </div>
        </div>

        <div class="movement-box">
            <div class="movement-title">File</div>
            <div class="movement-grid">
                <div class="key up">gg (top)</div>
                <div class="key down">G (end)</div>
                <div class="key left">^B (page↑)</div>
                <div class="key right">^F (page↓)</div>
                <div class="key center">% (jump)</div>
            </div>
        </div>
    </div>
</body>
</html>
